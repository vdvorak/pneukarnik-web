name: pneukarnik-web

x-wp-volumes: &wp-volumes
  - wp_data:/var/www/html
  - ./wp-content/themes/pneukarnik:/var/www/html/wp-content/themes/pneukarnik
  - ./wp-content/plugins/pneukarnik-booking:/var/www/html/wp-content/plugins/pneukarnik-booking

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes: *wp-volumes
    ports:
      - "${WP_PORT:-8080}:80"

  # WP-CLI pro instalaci a nastavení lokálního webu (bin/setup.sh).
  cli:
    image: wordpress:cli-2-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      HOME: /tmp
      WP_URL: http://localhost:${WP_PORT:-8080}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/pneukarnik:/var/www/html/wp-content/themes/pneukarnik
      - ./wp-content/plugins/pneukarnik-booking:/var/www/html/wp-content/plugins/pneukarnik-booking
      - ./docker/cli:/scripts:ro
    profiles: [tools]

  # PHP nástroje: Composer, PHPUnit (WP test suite), PHPCS, PHPStan.
  tools:
    build: docker/tools
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      WP_PHPUNIT__TESTS_CONFIG: /app/tests/phpunit/wp-tests-config.php
    working_dir: /app
    volumes:
      - .:/app
    profiles: [tools]

volumes:
  db_data:
  wp_data:
